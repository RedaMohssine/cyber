# --- CaptusBank version VULNÉRABLE ---
server {
    listen 80;
    server_name vuln.bank.local;

    location / {
        proxy_pass http://app-vulnerable:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- CaptusBank version SÉCURISÉE ---
server {
    listen 80;
    server_name secure.bank.local;

    location / {
        proxy_pass http://app-secure:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Infrastructure ATTAQUANT ---
server {
    listen 80;
    server_name evil.attacker.lab;

    location / {
        proxy_pass http://attacker-server:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Default catch-all
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
