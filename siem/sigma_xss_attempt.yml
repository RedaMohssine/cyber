title: Potential Stored XSS Payload Submitted
id: 7e1b2a13-1a5e-4d22-8c4d-0b4a4af2f003
status: experimental
description: |
    Détecte la soumission d'un payload caractéristique d'un XSS via les
    endpoints de saisie utilisateur (commentaires, profil, note de virement).
author: P03 BLUE TEAM
date: 2026/05/12
references:
    - https://cwe.mitre.org/data/definitions/79.html
logsource:
    product: nginx
    service: access
detection:
    selection:
        cs-method: 'POST'
        cs-uri-stem|contains:
            - '/comments.php'
            - '/profile.php'
            - '/transfer.php'
        cs-body|contains:
            - '<script'
            - 'onerror='
            - 'javascript:'
            - 'document.cookie'
            - 'eval('
    condition: selection
falsepositives:
    - Forum technique légitime parlant de XSS
level: medium
tags:
    - attack.initial_access
    - attack.t1190
    - cwe.79
    - owasp.a03
