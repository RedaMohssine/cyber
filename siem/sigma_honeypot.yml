title: Honeypot Account Login - Compromise Indicator
id: 7e1b2a13-1a5e-4d22-8c4d-0b4a4af2f004
status: stable
description: |
    Le compte `admin_honeypot` n'est jamais utilisé légitimement.
    Toute connexion réussie sur ce compte indique soit une compromission
    de crédentials, soit l'utilisation d'une session forgée/devinée.
author: P03 BLUE TEAM
