services:
  mysql:
    image: mysql:8.0
    container_name: p03-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: bank_vuln
      MYSQL_USER: bankuser
      MYSQL_PASSWORD: bankpass
    volumes:
      - ./app-vulnerable/sql/01-schema.sql:/docker-entrypoint-initdb.d/01-vuln-schema.sql:ro
      - ./app-secure/sql/01-schema.sql:/docker-entrypoint-initdb.d/02-secure-schema.sql:ro
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - bank_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-vulnerable:
    build: ./app-vulnerable
    container_name: p03-app-vuln
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: bank_vuln
      DB_USER: bankuser
      DB_PASS: bankpass
      APP_MODE: vulnerable
      ATTACKER_URL: http://evil.attacker.lab
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bank_net

  app-secure:
    build: ./app-secure
    container_name: p03-app-secure
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: bank_secure
      DB_USER: bankuser
      DB_PASS: bankpass
      APP_MODE: secure
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bank_net

  attacker-server:
    build: ./attacker-server
    container_name: p03-attacker
    restart: unless-stopped
    volumes:
      - attacker_data:/var/www/html/data
    networks:
      - bank_net

  nginx:
    image: nginx:1.27-alpine
    container_name: p03-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app-vulnerable
      - app-secure
      - attacker-server
    networks:
      - bank_net

volumes:
  mysql_data:
  attacker_data:

networks:
  bank_net:
    driver: bridge
